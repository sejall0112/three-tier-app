name: Deploy Three Tier App

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  S3_BUCKET: github-deployment-0411
  APPLICATION_NAME: 3tier-app
  DEPLOYMENT_GROUP: staging

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare deployment package
        run: |
          chmod +x scripts/*.sh

          zip -r deployment.zip \
            appspec.yml \
            frontend \
            backend \
            scripts

      - name: Upload package to S3
        run: |
          aws s3 cp deployment.zip \
            s3://${S3_BUCKET}/releases/${GITHUB_SHA}.zip

      - name: Create CodeDeploy deployment
        id: deploy
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$APPLICATION_NAME" \
            --deployment-group-name "$DEPLOYMENT_GROUP" \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket="$S3_BUCKET",key="releases/${GITHUB_SHA}.zip",bundleType=zip \
            --description "GitHub deployment ${GITHUB_SHA}" \
            --query deploymentId \
            --output text)

          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment completion
        run: |
          aws deploy wait deployment-successful \
            --deployment-id "${{ steps.deploy.outputs.deployment_id }}"

      - name: Deployment successful
        run: echo "Application deployed successfully!"

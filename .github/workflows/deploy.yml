name: Deploy Three Tier App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package application
        run: |
          zip -r app.zip backend frontend

      - name: Upload package to S3
        run: |
          aws s3 cp app.zip \
            s3://${{ secrets.S3_BUCKET }}/releases/${{ github.sha }}.zip

      - name: Find running EC2 instances
        id: instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names app-asg \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "No InService EC2 instances found."
            exit 1
          fi

          echo "Found instances: $INSTANCE_IDS"
          echo "ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"

      - name: Deploy using SSM
        run: |
          BUCKET="${{ secrets.S3_BUCKET }}"
          RELEASE_KEY="releases/${{ github.sha }}.zip"

          DEPLOY_SCRIPT=$(cat <<EOF
          set -e
          dnf install -y unzip
          mkdir -p /opt/combined-app /usr/share/nginx/html
          aws s3 cp s3://$BUCKET/$RELEASE_KEY /tmp/app.zip --region eu-north-1
          rm -rf /tmp/app-release
          mkdir -p /tmp/app-release
          unzip -o /tmp/app.zip -d /tmp/app-release
          cp /tmp/app-release/backend/server.js /opt/combined-app/
          cp /tmp/app-release/backend/package.json /opt/combined-app/
          if [ -f /tmp/app-release/backend/package-lock.json ]; then
            cp /tmp/app-release/backend/package-lock.json /opt/combined-app/
          fi
          cp /tmp/app-release/frontend/index.html /usr/share/nginx/html/
          cd /opt/combined-app
          npm install --omit=dev
          systemctl restart combined-backend
          systemctl restart nginx
          curl -fsS http://localhost/health
          EOF
          )

          echo "$DEPLOY_SCRIPT" > deploy-script.sh
          jq -n --rawfile script deploy-script.sh \
            '{commands: [$script]}' > ssm-parameters.json

          INSTANCE_IDS="${{ steps.instances.outputs.ids }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --comment "Deploy GitHub commit ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Waiting for deployment on $INSTANCE_ID"

            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text
          done

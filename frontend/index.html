<!DOCTYPE html>
<html>
<head>
  <title>AWS Three-Tier Application</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    li { margin: 10px 0; }
  </style>
</head>
<body>
  <h1>AWS Three-Tier Application</h1>
  <h2>Products from Amazon RDS</h2>
  <div id="products">Loading products...</div>

  <script>
    fetch('/api/products')
      .then(response => {
        if (!response.ok) throw new Error('API request failed');
        return response.json();
      })
      .then(products => {
        document.getElementById('products').innerHTML =
          '<ul>' + products.map(p =>
            `<li>${p.name} - ₹${p.price}</li>`
          ).join('') + '</ul>';
      })
      .catch(error => {
        document.getElementById('products').textContent = error.message;
      });
  </script>
</body>
</html>
